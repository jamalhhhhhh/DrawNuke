name: Build IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: xcodebuild -project DrawNuke.xcodeproj -target DrawNuke -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find . -type d -name "DrawNuke.app" | grep -v Intermediates | head -1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "App bundle not found:"
            find . -maxdepth 8 -type d -name "*.app"
            exit 1
          fi
          echo "Found app at $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry DrawNuke.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DrawNuke-ipa
          path: DrawNuke.ipa
