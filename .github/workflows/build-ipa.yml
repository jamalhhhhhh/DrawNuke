name: Build IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build apps (unsigned)
        run: |
          xcodebuild -project DrawNuke.xcodeproj -target DrawNuke -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          xcodebuild -project DrawNuke.xcodeproj -target RemoteTouch -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPAs
        run: |
          mkdir -p ipas
          for APP in $(find . -type d -name "*.app" | grep -v Intermediates); do
            NAME=$(basename "$APP" .app)
            rm -rf Payload
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry "ipas/$NAME.ipa" Payload
          done
          ls -la ipas

      - name: Upload DrawNuke IPA
        uses: actions/upload-artifact@v4
        with:
          name: DrawNuke-ipa
          path: ipas/DrawNuke.ipa

      - name: Upload RemoteTouch IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemoteTouch-ipa
          path: ipas/RemoteTouch.ipa
