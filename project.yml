name: DrawNuke
options:
  bundleIdPrefix: com.drawnuke
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
targets:
  DrawNuke:
    type: application
    platform: iOS
    sources:
      - path: DrawNuke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drawnuke.game
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: DrawNuke
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  RemoteTouch:
    type: application
    platform: iOS
    sources:
      - path: RemoteTouch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drawnuke.remotetouch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: RemoteTouch/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: RemoteTouch
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
